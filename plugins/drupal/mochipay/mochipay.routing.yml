mochipay.checkout:
  path: '/mochipay/checkout/{commerce_payment_gateway}'
  defaults:
    _controller: '\Drupal\mochipay\Controller\Checkout::handle'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
    parameters:
      commerce_payment_gateway:
        type: entity:commerce_payment_gateway
  methods: [GET, POST]
