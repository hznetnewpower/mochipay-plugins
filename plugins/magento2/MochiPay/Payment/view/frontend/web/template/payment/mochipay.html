<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
  <div class="payment-method-title field choice">
    <input type="radio" name="payment[method]" class="radio" data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
    <label data-bind="attr: {'for': getCode()}" class="label"><span data-bind="text: getTitle()"></span></label>
  </div>
  <div class="payment-method-content">
    <div class="field required"><label class="label"><span>Payment currency and network</span></label><div class="control">
      <select class="select" data-bind="options: getMethods(), optionsText: 'label', optionsValue: 'value', value: selectedMethod"></select>
    </div></div>
    <div class="checkout-agreements-block"><!-- ko foreach: $parent.getRegion('before-place-order') --><!-- ko template: getTemplate() --><!-- /ko --><!--/ko--></div>
    <div class="actions-toolbar"><div class="primary"><button class="action primary checkout" type="submit" data-bind="click: placeOrder, attr: {title: $t('Place Order')}, enable: (getCode() == isChecked()), css: {disabled: !isPlaceOrderActionAllowed()}"><span data-bind="i18n: 'Place Order'"></span></button></div></div>
  </div>
</div>
