<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MochiPay</title><link rel="stylesheet" href="popup.css"><script src="i18n.js" defer></script><script src="popup.js" defer></script></head>
<body><header><div class="brand"><img src="icons/icon48.png" alt=""><div><b>MochiPay</b><small data-i18n="assistant"></small></div></div><select id="language" aria-label="Language"></select></header>
<main><div id="message" class="message" role="status" hidden></div>
<section id="connect"><span class="eyebrow" data-i18n="start"></span><h1 data-i18n="connectTitle"></h1><p data-i18n="connectHint"></p><a id="getCode" class="button secondary" href="https://mochi.bz/Merchant/BrowserAssistant.aspx" target="_blank" rel="noopener" data-i18n="getCode"></a><form id="connectForm"><label for="code" data-i18n="code"></label><input id="code" type="password" autocomplete="off" spellcheck="false" required maxlength="43"><button id="connectButton" type="submit" data-i18n="connect"></button></form><p class="fine" data-i18n="scope"></p></section>
<section id="workspace" hidden><div class="account"><span id="merchant"></span><span id="accountStatus" class="badge"></span></div><nav aria-label="Sections"><button id="newTab" class="tab active" type="button" data-i18n="new"></button><button id="recentTab" class="tab" type="button" data-i18n="recent"></button><button id="settingsTab" class="tab" type="button" data-i18n="settings"></button></nav>
<section id="newPanel"><div id="attempt" class="attempt" hidden><p data-i18n="pendingAttempt"></p><button id="retry" type="button" data-i18n="retry"></button></div><form id="orderForm"><div class="row"><div><label for="amount" data-i18n="amount"></label><input id="amount" type="text" inputmode="decimal" placeholder="100.00" autocomplete="off" required maxlength="25"></div><div><label for="currency" data-i18n="currency"></label><select id="currency" required></select></div></div><label for="method" data-i18n="method"></label><select id="method" required></select><label for="note" data-i18n="note"></label><textarea id="note" rows="2" maxlength="500"></textarea><p class="fine" data-i18n="checkoutHint"></p><button id="create" type="submit" data-i18n="create"></button></form><div id="result" hidden><div class="success" data-i18n="linkReady"></div><div id="resultAmount" class="amount"></div><div id="resultStatus" class="badge"></div><div id="resultNote" class="fine"></div><label for="paymentLink" data-i18n="paymentLink"></label><input id="paymentLink" readonly dir="ltr"><div class="actions"><button id="copy" type="button" data-i18n="copy"></button><button id="showQr" class="secondary" type="button" data-i18n="qr"></button></div><div id="qrPanel" hidden><img id="qr" alt="Payment link QR"><p class="fine" data-i18n="scan"></p></div><a id="detail" target="_blank" rel="noopener" data-i18n="details"></a><button id="another" class="secondary" type="button" data-i18n="another"></button></div></section>
<section id="recentPanel" hidden><div class="sectionTitle"><h2 data-i18n="recent"></h2><button id="refresh" class="textButton" type="button" data-i18n="refresh"></button></div><p id="updated" class="fine"></p><p id="empty" data-i18n="empty"></p><div id="orders"></div></section>
<section id="settingsPanel" hidden><h2 data-i18n="settings"></h2><label class="notification"><input id="notifications" type="checkbox"><span data-i18n="notifications"></span></label><p class="fine" data-i18n="notificationHint"></p><p class="fine" data-i18n="scope"></p><a href="https://mochi.bz/Payment/ChromeAssistantPrivacy.aspx" target="_blank" rel="noopener" data-i18n="privacy"></a><button id="disconnect" class="secondary danger" type="button" data-i18n="disconnect"></button></section></section></main><footer><a href="https://mochi.bz/Merchant/Dashboard.aspx" target="_blank" rel="noopener" data-i18n="dashboard"></a><a href="https://mochi.bz/Payment/GuideChromeAssistant.aspx" target="_blank" rel="noopener" data-i18n="guide"></a></footer></body></html>
